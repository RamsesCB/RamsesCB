name: Generate Snake

on:
  schedule:
    # Se ejecuta cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
   
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: RamsesCB
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Polish Snake SVG
        run: |
          sed -i 's/\.u{/\.u{display:none!important}\.s\.s0{fill:#38bdf8}\.s\.s1{fill:#22d3ee;opacity:0.95}\.s\.s2{fill:#0ea5e9;opacity:0.8}\.s\.s3{fill:#0284c7;opacity:0.65}\.u{/g' dist/*.svg

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
